name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nenhum segredo: a suíte inteira roda offline, sem token.
  AGENDA_ALLOW_EXECUTE: "0"
  TZ: America/Bahia
  PYTHONUNBUFFERED: "1"

jobs:
  testes:
    name: testes (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: compilar
        run: python -m compileall -q bot database scripts tests

      - name: suíte do projeto
        run: python -m pytest tests -q -m "not deploy"

      - name: testes de implantação
        run: python -m pytest tests/deploy -q

      - name: wiring do bot (sem rede)
        run: python -m bot.app --self-check

      - name: preflight (modo dev, sem token)
        run: python scripts/preflight.py --mode dev --scan-repo

  artefatos:
    name: artefatos de implantação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: instalar dependências de teste
        run: pip install -r requirements-dev.txt

      - name: validar sintaxe do compose (sem .env e com .env)
        run: |
          docker compose config --quiet          # sem .env: modo seguro
          docker compose config --services
          cp .env.example .env
          docker compose config --quiet
          docker compose config --services

      - name: verificar que nenhum segredo está versionado
        run: python scripts/preflight.py --mode dev --scan-repo --json

      - name: shell scripts válidos
        run: |
          bash -n scripts/deploy_check.sh
          shellcheck scripts/deploy_check.sh || true

      - name: verificação de implantação completa
        run: scripts/deploy_check.sh --skip-build

  imagem:
    name: build da imagem
    runs-on: ubuntu-latest
    needs: [testes]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agenda-cultural-salvador:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: fumaça na imagem (sem token, sem rede externa)
        run: |
          docker run --rm -e AGENDA_DB=/tmp/none.db agenda-cultural-salvador:ci \
            python scripts/scheduler.py --print-plan
          set +e
          docker run --rm -e BOT_TOKEN= agenda-cultural-salvador:ci python -m bot.app
          code=$?
          set -e
          test "$code" -eq 2   # sem token o processo recusa iniciar
          docker run --rm -e AGENDA_DB=/tmp/t.db agenda-cultural-salvador:ci \
            sh -c 'python -m bot.admin --db /tmp/t.db init --admin 1 && python scripts/healthcheck.py --db /tmp/t.db --json'

      - name: usuário não-root na imagem
        run: test "$(docker run --rm agenda-cultural-salvador:ci id -u)" = "10001"
